# פריסה אוטומטית ל-Cloudflare Pages בכל דחיפה ל-main.
#
# עד עכשיו הפריסה הייתה ידנית מהמחשב (`npm run deploy`), ולכן קוד שנדחף ל-main
# לא בהכרח עלה לאוויר — ובעיקר: סוד חדש שהוגדר ב-Pages לא נכנס לתוקף עד שמישהו
# פרס מחדש. עם הקובץ הזה הדחיפה עצמה מפרסת.
#
# ── הפעלה (פעם אחת, אפשר גם מהטלפון) ──────────────────────────────────────
# 1. Cloudflare → My Profile → API Tokens → Create Token → Custom token:
#      Permissions:  Account · Cloudflare Pages · Edit
#      (מספיק זה. אל תיתנו הרשאות רחבות יותר ממה שצריך.)
# 2. GitHub → הריפו → Settings → Secrets and variables → Actions → New secret:
#      CLOUDFLARE_API_TOKEN   = האסימון מהשלב הקודם
#      CLOUDFLARE_ACCOUNT_ID  = מזהה החשבון, מופיע בכתובת של דשבורד Cloudflare
#                               ובעמוד Workers & Pages
#
# בלי שני הסודות האלה ה-workflow נעצר בשלב הבדיקה עם הודעה מסבירה, ולא מנסה
# לפרוס. כלומר עד שתגדירו אותם שום דבר לא משתנה.
#
# ⚠️ מרגע ההפעלה, כל דחיפה ל-main עולה לאוויר. אפשר תמיד לפרוס גם ידנית,
#    וגם להריץ מכאן ידנית (Actions → Deploy to Cloudflare Pages → Run workflow).

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# פריסה אחת בכל רגע; דחיפה חדשה מבטלת פריסה שעדיין רצה
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: בדיקה שהסודות מוגדרים
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::חסרים CLOUDFLARE_API_TOKEN או CLOUDFLARE_ACCOUNT_ID. ההוראות בראש .github/workflows/deploy.yml"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # בדיקת תחביר על הקוד שרץ בשרת ובדפדפן. זולה, ומונעת פריסה של קובץ שבור.
      - name: בדיקת תחביר
        run: |
          find functions public/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name shul-board --branch main --commit-dirty=true
